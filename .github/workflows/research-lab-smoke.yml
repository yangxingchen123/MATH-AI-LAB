# MATH-AI-LAB research-lab smoke. Stdlib only; no LLM, solver, or Mathlib.

name: Research Lab Smoke

on:
  push:
    paths:
      - "tools/research_lab/**"
      - "tests/research_lab/**"
      - "packages/domain-frontier/**"
      - "packages/domain-exploration/**"
      - "docs/research/exploration/**"
      - "vendor/erdosproblems/**"
      - "06_LEAN形式化/**"
      - "docs/superpowers/specs/2026-08-28-research-lab-maturity-design.md"
      - "10_提示词/Research_Lab_Usage_Guide.md"
      - ".github/workflows/research-lab-smoke.yml"
      - "requirements.txt"
      - "requirements.lock"
  pull_request:
    paths:
      - "tools/research_lab/**"
      - "tests/research_lab/**"
      - "packages/domain-frontier/**"
      - "packages/domain-exploration/**"
      - "docs/research/exploration/**"
      - "vendor/erdosproblems/**"
      - "06_LEAN形式化/**"
      - "docs/superpowers/specs/2026-08-28-research-lab-maturity-design.md"
      - "10_提示词/Research_Lab_Usage_Guide.md"
      - ".github/workflows/research-lab-smoke.yml"
      - "requirements.txt"
      - "requirements.lock"

jobs:
  research-lab-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q tests/research_lab tests/lean_formalization
      - run: python -m tools.research_lab doctor
      - run: python -m tools.research_lab operate
      - run: python -m tools.research_lab explore
      - run: python -m tools.research_lab cycle --n 5
      - run: python -m tools.research_lab check-session --file tests/research_lab/fixtures/sessions/infra_ok.yaml
      - run: python -m tools.research_lab list-problems
      - run: python -m tools.research_lab prior-art-matrix
      - run: python -m tools.research_lab funnel --n 5 --limit 6
      - run: python -m tools.research_lab backlog
      - run: python -m tools.research_lab lemma-graph
      - run: python -m tools.research_lab risks
      - run: python -m tools.research_lab gate
      - run: python -m tools.research_lab verify
