theorems:
  - id: ALG-001
    natural_language: "2 + 2 = 4"
    natural_language_ref: statements/ALG-001.md
    lean_decl: MathAILab.Research.two_add_two
    lean_file: MathAILab/Research/TwoAddTwo.lean
    family: algebra
    quantifiers: none
    objects: Nat
    assumptions: []
    conclusion: equality
  - id: ALG-002
    natural_language: "for all natural numbers n, n + 0 = n"
    natural_language_ref: statements/ALG-002.md
    lean_decl: MathAILab.Research.nat_add_zero
    lean_file: MathAILab/Research/TwoAddTwo.lean
    family: algebra
    quantifiers: forall n
    objects: Nat
    assumptions: []
    conclusion: equality
  - id: DISC-001
    natural_language: "the reverse of the empty list is empty"
    natural_language_ref: statements/DISC-001.md
    lean_decl: MathAILab.Research.rev_nil
    lean_file: MathAILab/Research/RevNil.lean
    family: discrete
    quantifiers: none
    objects: List
    assumptions:
      - "rev is the recursive reverse defined in this module"
    conclusion: equality
  - id: ALG-003
    natural_language: "for all natural numbers n, 0 + n = n"
    natural_language_ref: statements/ALG-003.md
    lean_decl: MathAILab.Research.zero_add
    lean_file: MathAILab/Research/TwoAddTwo.lean
    family: algebra
    quantifiers: forall n
    objects: Nat
    assumptions: []
    conclusion: equality
  - id: DISC-002
    natural_language: "for all lists xs of natural numbers, length (rev xs) = length xs"
    natural_language_ref: statements/DISC-002.md
    lean_decl: MathAILab.Research.length_rev
    lean_file: MathAILab/Research/RevNil.lean
    family: discrete
    quantifiers: forall xs
    objects: List
    assumptions:
      - "rev is the recursive reverse defined in this module"
    conclusion: equality
  - id: ALG-004
    natural_language: "for all natural numbers m and n, m + n = n + m"
    natural_language_ref: statements/ALG-004.md
    lean_decl: MathAILab.Research.add_comm
    lean_file: MathAILab/Research/TwoAddTwo.lean
    family: algebra
    quantifiers: forall m n
    objects: Nat
    assumptions: []
    conclusion: equality
    depends_on:
      - ALG-002
      - ALG-003
  - id: ANL-001
    natural_language: "for all integers x and p, x p + p x ≤ x^2 + p^2"
    natural_language_ref: statements/ANL-001.md
    lean_decl: MathAILab.Research.fenchel_young_quadratic
    lean_file: MathAILab/Research/QuadraticConjugate.lean
    family: analysis
    quantifiers: forall x p
    objects: Int
    assumptions: []
    conclusion: inequality
  - id: ANL-002
    natural_language: "for all integers p, the scaled quadratic dual attains p^2 at x = p"
    natural_language_ref: statements/ANL-002.md
    lean_decl: MathAILab.Research.quadratic_conjugate_attained
    lean_file: MathAILab/Research/QuadraticConjugate.lean
    family: analysis
    quantifiers: forall p
    objects: Int
    assumptions: []
    conclusion: equality
  - id: ANL-003
    natural_language: "for all integers x and p, x p + p x = x^2 + p^2 iff x = p"
    natural_language_ref: statements/ANL-003.md
    lean_decl: MathAILab.Research.quadratic_eq_iff
    lean_file: MathAILab/Research/QuadraticConjugate.lean
    family: analysis
    quantifiers: forall x p
    objects: Int
    assumptions: []
    conclusion: iff
  - id: ANL-004
    natural_language: "for all integers x, the scaled Fenchel-Young identity holds at p = -1"
    natural_language_ref: statements/ANL-004.md
    lean_decl: MathAILab.Research.quadratic_at_neg
    lean_file: MathAILab/Research/QuadraticConjugate.lean
    family: analysis
    quantifiers: forall x
    objects: Int
    assumptions:
      - "p is the negative unit; the identity does not require p > 0"
    conclusion: inequality
    depends_on:
      - ANL-001
  - id: DISC-003
    natural_language: "for all n, the odd numbers in {1,...,n} form a sum-free list"
    natural_language_ref: statements/DISC-003.md
    lean_decl: MathAILab.Research.odds_sum_free
    lean_file: MathAILab/Research/SumFree.lean
    family: discrete
    quantifiers: forall n
    objects: List Nat
    assumptions:
      - "odds is the recursive odd-number list in this module"
    conclusion: sum-free
  - id: DISC-004
    natural_language: "for all n, the odd numbers in {1,...,n} have length (n+1)/2"
    natural_language_ref: statements/DISC-004.md
    lean_decl: MathAILab.Research.odds_length
    lean_file: MathAILab/Research/SumFree.lean
    family: discrete
    quantifiers: forall n
    objects: List Nat
    assumptions:
      - "odds is the recursive odd-number list in this module"
    conclusion: equality
  - id: DISC-005
    natural_language: "the list [1, 2, 3] is not sum-free"
    natural_language_ref: statements/DISC-005.md
    lean_decl: MathAILab.Research.one_two_three_not_sum_free
    lean_file: MathAILab/Research/SumFree.lean
    family: discrete
    quantifiers: none
    objects: List Nat
    assumptions:
      - "isSumFree forbids a+b in the list"
    conclusion: negation
  - id: DISC-006
    natural_language: "a nodup sum-free list in {1,...,n} has length at most (n+1)/2"
    natural_language_ref: statements/DISC-006.md
    lean_decl: MathAILab.Research.sum_free_length_le
    lean_file: MathAILab/Research/SumFree.lean
    family: discrete
    quantifiers: forall xs n
    objects: List Nat
    assumptions:
      - "members of xs lie in {1,...,n}"
      - "xs is nodup"
      - "xs is sum-free"
    conclusion: inequality
