# MATH-AI-LAB Lean Sidecar.
# Not part of Core. Missing lake must not fail ordinary mathematics paths.
# This workflow only runs when Lean sources or the adapter change.

name: Lean Sidecar Verification

on:
  push:
    paths:
      - "06_LEAN形式化/**"
      - "tools/lean_formalization/**"
      - "tests/lean_formalization/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "06_LEAN形式化/**"
      - "tools/lean_formalization/**"
      - "tests/lean_formalization/**"
      - ".github/workflows/lean.yml"

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Lean adapter tests
        run: python -m pytest -q tests/lean_formalization

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: "06_LEAN形式化"
        run: lake build

      - name: Forbidden tactic scan
        run: python -m tools.lean_formalization scan --root "06_LEAN形式化"

      - name: Correspondence check
        run: python -m tools.lean_formalization check-correspondence
