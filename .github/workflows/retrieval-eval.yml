# MATH-AI-LAB retrieval evaluation.
# Python 3.13 + root requirements.txt only. No vector database.

name: Retrieval Eval

on:
  push:
    paths:
      - "tools/retrieval/**"
      - "tests/retrieval/**"
      - ".github/workflows/retrieval-eval.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "tools/retrieval/**"
      - "tests/retrieval/**"
      - ".github/workflows/retrieval-eval.yml"
      - "requirements.txt"

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/retrieval
      - run: python -m tools.retrieval gate
