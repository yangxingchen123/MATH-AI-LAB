# MATH-AI-LAB figure smoke.
# Python 3.13 + root requirements.txt only. No matplotlib/plotly/manim.

name: Figure Smoke Verification

on:
  push:
    paths:
      - "tools/figure/**"
      - "tests/figure/**"
      - ".github/workflows/figure-smoke.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "tools/figure/**"
      - "tests/figure/**"
      - ".github/workflows/figure-smoke.yml"
      - "requirements.txt"

jobs:
  figure-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run figure tests
        run: python -m pytest -q tests/figure

      - name: Evaluate v1.5 gate
        run: python -m tools.figure gate
