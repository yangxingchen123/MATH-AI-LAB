# MATH-AI-LAB controlled multi-agent smoke.
# Deterministic Candidate roles only. No vendor Agent runtime.

name: Collaboration Smoke

on:
  push:
    paths:
      - "tools/collaboration/**"
      - "tests/collaboration/**"
      - "tools/review/**"
      - ".github/workflows/collaboration-smoke.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "tools/collaboration/**"
      - "tests/collaboration/**"
      - "tools/review/**"
      - ".github/workflows/collaboration-smoke.yml"
      - "requirements.txt"

jobs:
  collaboration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/collaboration
      - run: python -m tools.collaboration gate
